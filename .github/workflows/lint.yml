# El linter del proyecto. Su versión tiene que estar construida con un Go al menos tan
# nuevo como el que analiza: uno construido con un Go más viejo no sabe leer los datos
# exportados del más nuevo, y falla con un error de importación que no dice la causa.
name: Linter

on:
  push:
    # La rama por defecto del repositorio: un nombre que no exista deja los envíos sin comprobar.
    branches: [feat/product-base]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Preparar Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Análisis del propio lenguaje
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout 5m
