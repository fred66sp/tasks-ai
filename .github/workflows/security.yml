# Vulnerabilidades conocidas en lo que el producto realmente llama. Un análisis
# genérico de dependencias avisa de mucho que no se usa; este no.
name: Seguridad

on:
  push:
    # La rama por defecto del repositorio: un nombre que no exista deja los envíos sin comprobar.
    branches: [feat/product-base]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerabilities:
    name: Vulnerabilidades conocidas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Preparar Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Buscar vulnerabilidades en el código que se ejecuta
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
