# Pruebas del producto en cada cambio. El suelo de cobertura es un contrato: un cambio
# que lo baje no pasa. Deja margen a que una rama poco frecuente no se recorra en una
# ejecución concreta, pero no al hueco que deja una prueba que falta.
name: Pruebas

on:
  push:
    # La rama por defecto del repositorio, que es `main`: un nombre que no exista deja los
    # envíos sin comprobar.
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Suelo de cobertura total de sentencias, en porcentaje: un trinquete que solo sube. El
  # número va por debajo de lo que mide la suite en el servidor —hoy, alrededor del 62 %—,
  # con margen para la versión de Go que ese servidor instala: sus parches cuentan la
  # cobertura un poco distinto, y sin margen el suelo fallaría por eso y no por el código.
  # Se ajusta a mano, y solo hacia arriba.
  MIN_COVERAGE: "60.5"

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Preparar Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Comprobar las dependencias
        run: |
          go mod verify
          go mod download

      - name: Comprobar que go.mod y go.sum estén al día
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # La interfaz web se construye con Node 24.
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Comprobar que la interfaz construida esté al día
        run: |
          (cd web && npm ci && npm run build)
          git diff --exit-code -- web/public

      - name: Compilar
        run: go build ./...

      - name: Pasar las pruebas, con carreras y en orden mezclado
        run: go test -v -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Comprobar el suelo de cobertura
        run: |
          total=$(awk '/^total:/ {gsub(/%/, "", $NF); print $NF}' <(go tool cover -func=coverage.out))
          echo "cobertura total: ${total}% con un mínimo de ${MIN_COVERAGE}%"
          awk -v total="${total}" -v min="${MIN_COVERAGE}" 'BEGIN { exit !(total + 0 >= min + 0) }'
